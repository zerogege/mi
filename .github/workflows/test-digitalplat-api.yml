name: Test DigitalPlat API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query DigitalPlat domains
        env:
          DP_API_KEY: ${{ secrets.DP_API_KEY }}
        run: |
          STATUS=$(curl -sS \
            -D headers.txt \
            -o response.txt \
            -w "%{http_code}" \
            "https://domain-api.digitalplat.org/api/v1/domains" \
            -H "Authorization: Bearer $DP_API_KEY" \
            -H "Accept: application/json")

          echo "HTTP status: $STATUS"
          echo "===== Headers ====="
          cat headers.txt

          echo "===== Response ====="
          head -c 3000 response.txt
          echo

          if grep -qi "cf-mitigated: challenge" headers.txt; then
            echo "Cloudflare challenge intercepted the API request"
            exit 1
          fi

          if [ "$STATUS" != "200" ]; then
            echo "API returned HTTP $STATUS"
            exit 1
          fi

          jq . response.txt
