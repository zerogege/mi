name: Recheck IPs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 */2 * *'   # 每2天一次，UTC 8点（北京16点）

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt

      - name: Pull results
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/zerogege/proxyip.git result_repo
          cp result_repo/*.txt ./ 2>/dev/null || true

      - name: Recheck
        run: |
          shopt -s nullglob
          FILES=""
          for f in *.txt; do
            if [ "$f" != "requirements.txt" ] && [ "$f" != "count.txt" ] && [ "$f" != "name.txt" ] && [ "$f" != "ip.txt" ] && [ "$f" != "recheck_summary.txt" ]; then
              FILES="$FILES $f"
            fi
          done
          echo "复验文件: $FILES"
          if [ -n "$FILES" ]; then
            python recheck_api.py $FILES
          else
            echo "没有可复验的文件"
          fi
          # 显示摘要（如果有）
          if [ -s recheck_summary.txt ]; then
            echo "剔除摘要："
            cat recheck_summary.txt
          fi

      - name: Push back
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          cd result_repo
          for f in ../*.txt; do
            fn=$(basename "$f")
            if [ "$fn" != "requirements.txt" ] && [ "$fn" != "count.txt" ] && [ "$fn" != "name.txt" ] && [ "$fn" != "ip.txt" ] && [ "$fn" != "recheck_summary.txt" ]; then
              cp "$f" ./ 2>/dev/null || true
            fi
          done
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "recheck: 剔除失效IP + 更新落地"
            git pull --rebase
            git push
          fi

      - name: Backup to GitLab
        if: always()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone https://oauth2:${GITLAB_TOKEN}@gitlab.com/7969521/proxyip-backup.git gitlab_repo
          cp -r result_repo/*.txt gitlab_repo/ 2>/dev/null || true
          mkdir -p gitlab_repo/state
          cp result_repo/state/*.txt gitlab_repo/state/ 2>/dev/null || true
          cd gitlab_repo
          git config user.email "bot@backup.com"
          git config user.name "bot"
          git add -A
          if git diff --staged --quiet; then
            echo "GitLab: no change"
          else
            git commit -m "recheck backup"
            git pull --rebase 2>/dev/null || true
            git push
          fi

      - name: Notify TG
        if: always()
        run: |
          if [ -s recheck_summary.txt ]; then
            DETAILS=$(awk -F: '
              { total += $2; printf "  • %s：%s 个\n", $1, $2 }
              END { printf "合计剔除 %d 个", total }
            ' recheck_summary.txt)
            MSG=$(printf '🔄 小号复验完成，已剔除失效IP：\n%s' "$DETAILS")
          else
            if [ "${{ job.status }}" = "success" ]; then
              MSG="🔄 小号复验完成，无失效IP需剔除"
            else
              MSG=$(printf '❌ 小号复验失败\n状态: %s' "${{ job.status }}")
            fi
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode "text=${MSG}"
