name: DPDNS Renewal Reminder

on:
  # 支持在 Actions 页面手动运行测试
  workflow_dispatch:

  schedule:
    # GitHub Cron 使用 UTC 时间
    # UTC 04:00 = 北京时间 12:00

    # aliver.dpdns.org
    # 每年 8 月 18 日到期，4 月 21 日约剩余 119 天
    - cron: "0 4 21 4 *"

    # zerooooo.dpdns.org
    # 每年 10 月 28 日到期，7 月 1 日约剩余 119 天
    - cron: "0 4 1 7 *"

jobs:
  notify:
    name: Send renewal reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Build reminder message
        id: message
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MESSAGE=$(cat <<'EOF'
          🧪 DPDNS 续期提醒测试

          Telegram Bot 推送配置正常。

          域名续期计划：

          1️⃣ aliver.dpdns.org
          固定到期日：每年 8 月 18 日
          提醒日期：每年 4 月 21 日

          2️⃣ zerooooo.dpdns.org
          固定到期日：每年 10 月 28 日
          提醒日期：每年 7 月 1 日

          收到正式提醒后，请登录 DigitalPlat 后台点击“申请免费续费”。
          EOF
            )

          elif [ "$CRON_EXPRESSION" = "0 4 21 4 *" ]; then
            MESSAGE=$(cat <<'EOF'
          🔔 DPDNS 免费续期提醒

          域名：aliver.dpdns.org
          固定到期日：每年 8 月 18 日
          当前预计剩余 119 天，已经进入免费续期窗口。

          请登录 DigitalPlat 后台，点击“申请免费续费”。

          后台地址：
          https://dash.domain.digitalplat.org/
          EOF
            )

          elif [ "$CRON_EXPRESSION" = "0 4 1 7 *" ]; then
            MESSAGE=$(cat <<'EOF'
          🔔 DPDNS 免费续期提醒

          域名：zerooooo.dpdns.org
          固定到期日：每年 10 月 28 日
          当前预计剩余 119 天，已经进入免费续期窗口。

          请登录 DigitalPlat 后台，点击“申请免费续费”。

          后台地址：
          https://dash.domain.digitalplat.org/
          EOF
            )

          else
            MESSAGE=$(cat <<'EOF'
          ⚠️ DPDNS 提醒任务已触发，但无法识别对应的定时规则。

          请登录 GitHub Actions 查看运行日志。
          EOF
            )
          fi

          {
            echo "text<<MESSAGE_EOF"
            echo "$MESSAGE"
            echo "MESSAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        shell: bash
        env:
          # 使用你仓库里现有的 Secret 名称
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MESSAGE: ${{ steps.message.outputs.text }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "::error::没有读取到 TG_TOKEN"
            exit 1
          fi

          if [ -z "$TG_CHAT_ID" ]; then
            echo "::error::没有读取到 TG_CHAT_ID"
            exit 1
          fi

          HTTP_CODE=$(curl --silent --show-error \
            --output telegram_response.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true")

          echo "Telegram HTTP 状态码：$HTTP_CODE"
          cat telegram_response.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Telegram API 返回 HTTP $HTTP_CODE"
            exit 1
          fi

          if ! jq -e '.ok == true' telegram_response.json >/dev/null; then
            echo "::error::Telegram 返回 ok=false"
            exit 1
          fi

          echo "Telegram 续期提醒发送成功"
