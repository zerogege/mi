name: Scan Neburst

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2,14 * * *'

concurrency:
  group: scan-neburst
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: curl -L -o GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Pull state
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/zerogege/proxyip.git result_repo
          mkdir -p state
          cp result_repo/state/*.txt state/ 2>/dev/null || true
          cp result_repo/*.txt ./ 2>/dev/null || true

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: python final_scan.py "8143" "Neburst" "20000-60000"

      - name: Push
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          cd result_repo
          mkdir -p state
          cp ../state/*.txt state/ 2>/dev/null || true
          for f in ../*.txt; do
            fn=$(basename "$f")
            if [ "$fn" != "requirements.txt" ] && [ "$fn" != "count.txt" ] && [ "$fn" != "name.txt" ]; then
              cp "$f" ./ 2>/dev/null || true
            fi
          done
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Neburst update"
            git pull --rebase
            git push
          fi

      - name: Backup to GitLab
        if: always()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone https://oauth2:${GITLAB_TOKEN}@gitlab.com/7969521/proxyip-backup.git gitlab_repo
          cp -r result_repo/*.txt gitlab_repo/ 2>/dev/null || true
          mkdir -p gitlab_repo/state
          cp result_repo/state/*.txt gitlab_repo/state/ 2>/dev/null || true
          cd gitlab_repo
          git config user.email "bot@backup.com"
          git config user.name "bot"
          git add -A
          if git diff --staged --quiet; then
            echo "GitLab: no change"
          else
            git commit -m "backup"
            git pull --rebase 2>/dev/null || true
            git push
          fi

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ Neburst 扫描完成%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ Neburst 扫描失败%0A状态: ${{ job.status }}"
          fi
          curl "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}"
